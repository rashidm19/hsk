<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
</head>
<body class="app">
<div class="app-layout">
  <aside class="app-sidebar" id="app-sidebar" aria-label="Main navigation">
    <a href="#" class="app-brand"><span>HSK Prep</span></a>
    <div class="app-nav-label">Workspace</div>
    <nav class="app-nav">
      <a href="#" class="app-nav-link is-active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Mock Exams
      </a>
      <a href="#" class="app-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Vocabulary
      </a>
      <a href="#" class="app-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Characters
      </a>
      <a href="#" class="app-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        Grammar
      </a>
      <a href="#" class="app-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Sentences
      </a>
    </nav>
    <div class="app-sidebar-foot">
      <a href="#" class="app-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        Home
      </a>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <button type="button" class="app-menu-btn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="app-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" placeholder="Search tests, vocabulary…" aria-label="Search" disabled>
      </div>
      <div class="app-topbar-actions">
        <button type="button" class="app-icon-btn app-theme-btn" aria-label="Toggle dark mode">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <div class="app-profile is-hydrated">
          <div class="app-profile-info">
            <span class="app-profile-name">Li Wei</span>
            <span class="app-profile-email">liwei@example.com</span>
          </div>
          <div class="app-profile-avatar" aria-hidden="true">L</div>
        </div>
      </div>
    </header>

    <div class="app-content">
      <div class="dash-head"><h1>Mock Exams</h1></div>
      <div class="dash-stats">
        <div class="dash-stat-card"><div class="dash-stat-num">10</div><div class="dash-stat-label">Exams available</div></div>
        <div class="dash-stat-card"><div class="dash-stat-num">3</div><div class="dash-stat-label">Completed</div></div>
        <div class="dash-stat-card"><div class="dash-stat-num">86%</div><div class="dash-stat-label">Best score</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
