<!-- @dsCard group="Components" name="Buttons & CTA" subtitle="Primary / secondary / ghost / jade, block, CTA banner" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
</style>
</head>
<body>
  <h2 class="section-title" style="margin-top:0">Buttons</h2>
  <div class="row">
    <button class="btn btn-primary">Start mock exam</button>
    <button class="btn btn-secondary">Review answers</button>
    <button class="btn btn-ghost">Skip for now</button>
    <button class="btn btn-jade">Correct — continue</button>
  </div>
  <div class="row" style="max-width:360px">
    <button class="btn btn-primary btn-block">Full-width action (.btn-block)</button>
  </div>

  <h2 class="section-title">CTA banner (.cta-banner — inverted block, .cta-link lives here)</h2>
  <div class="cta-banner" style="margin-top:12px">
    <h3 style="margin:0 0 12px;font-size:var(--fs-xl)">Ready for the real exam?</h3>
    <button class="btn btn-primary">Start mock exam 1</button>
    <div><a class="cta-link" href="#">Browse all HSK 4 vocabulary first →</a></div>
  </div>
</body>
</html>
