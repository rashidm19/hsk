<!-- client picker (CONTRACT §1): one route, two presentation shells. Boot-time
     decision only — crossing the breakpoint mid-session does nothing until
     reload. localStorage 'hsk4-client' ('desktop'|'mobile') is a manual escape
     hatch, not exposed in UI yet. -->
<script>
(function(){
  var d=false;
  try{
    d=(window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches)
      ||Math.min(screen.width,screen.height)>=700;
  }catch(e){}
  try{ /* separate try: a storage SecurityError must not discard the heuristic */
    var o=localStorage.getItem('hsk4-client');
    if(o==='desktop')d=true;else if(o==='mobile')d=false;
  }catch(e){}
  window.HSK_DESKTOP=d;
  document.write('<link rel="stylesheet" href="/app/'+(d?'desktop':'app')+'.css">');
  /* Desktop bundle (~280KB) loads via document.write below, invisible to the
     preload scanner. Preload it here (in <head>, before the shared modules) so
     it fetches in PARALLEL — gated on d so mobile never pays for it. */
  if(d){var _dm=['config','shell','exam','vocab','more','study'];for(var _i=0;_i<_dm.length;_i++){document.write('<link rel="preload" as="script" href="/app/desktop-'+_dm[_i]+'.js">');}}
})();
</script>

<!-- Global error boundary (registered before the modules so a load-time throw in
     any of them is reported, not silently swallowed). Metrika-reports (capped) +
     console; the boot wrapper below paints a reload screen if boot itself throws. -->
<script>
(function(){var n=0;function report(kind,msg){try{if(n<5){n++;if(window.ymGoal)ymGoal('app_error',{kind:kind,msg:String(msg==null?'':msg).slice(0,180)});}}catch(e){}try{if(window.console&&console.warn)console.warn('[app]',kind,msg);}catch(e){}}
window.addEventListener('error',function(e){report('error',e&&(e.message||(e.error&&e.error.message)));});
window.addEventListener('unhandledrejection',function(e){report('rejection',e&&e.reason&&(e.reason.message||e.reason));});})();
</script>

<script>
(function(){
  /* Paint a reload screen only if the shell never rendered (empty #r-shell). */
  function fallback(reason){
    try{
      var r=document.getElementById('r-shell');
      if(r&&!r.innerHTML.trim()){
        try{if(window.ymGoal)ymGoal('app_error',{kind:'boot',msg:String(reason==null?'':reason).slice(0,180)});}catch(x){}
        r.innerHTML='<div style="display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:DM Sans,system-ui,sans-serif"><div style="font-size:1.05rem;font-weight:700;color:var(--ink,#2c2825)">Something went wrong</div><div style="font-size:.88rem;color:var(--stone,#8a817a);max-width:280px;line-height:1.5">The app hit an unexpected error. Please reload.</div><button onclick="location.reload()" style="border:0;background:var(--accent,#b84e2e);color:#fff8f1;border-radius:11px;padding:11px 22px;font-weight:700;font-size:.9rem;cursor:pointer">Reload</button></div>';
      }
    }catch(x){}
  }
  try{ App.boot(); }
  catch(e){ fallback(e&&e.message); return; }
  /* Boot didn't throw, but a module that silently failed to load (partial fetch,
     404) can leave the seams missing / the shell empty — assert and, if so, paint
     the reload card instead of a blank screen. */
  try{
    if(!(window.App&&App.screens&&App.screens.shell&&App.data&&typeof App.data.load==='function')){ fallback('missing seams'); return; }
  }catch(e2){ fallback('seams check'); return; }
  fallback('empty shell after boot');
})();
</script>
