<!-- F11 global error boundary. FIRST script in <head> so it also covers the
     vendor/auth/font/Metrika loads below; capture:true because a 404'd
     <script>/<link> fires a RESOURCE error that does not bubble to window.
     Reports are buffered until ymGoal exists (defined in the Metrika block
     below), so a failure before Metrika is not silently dropped; third-party
     losses (fonts, hanzi-writer, Metrika itself - all commonly ad-blocked and
     blocked in China) get their own small cap so they cannot crowd out OURS.
     <meta charset> stays the first thing in <head>: this block is ~1.4 KB and
     would otherwise push it past the 1024-byte encoding-sniffing window. -->
<script>
(function(){
  var CAP=5,CAP3P=2,sent=0,sent3p=0,buf=[];
  function push(rec){
    if(!window.ymGoal){ if(buf.length<20)buf.push(rec); return; }
    if(rec.kind==='res3p'){ if(sent3p>=CAP3P)return; sent3p++; }
    else { if(sent>=CAP)return; sent++; }
    try{window.ymGoal('app_error',rec);}catch(e){}
  }
  function flush(){var q=buf;buf=[];for(var i=0;i<q.length;i++)push(q[i]);}
  window.__hskFlushErrors=flush;
  function report(kind,msg){
    var rec={kind:kind,msg:String(msg==null?'':msg).slice(0,180)};
    try{if(window.console&&console.warn)console.warn('[app]',kind,rec.msg);}catch(e){}
    try{push(rec);}catch(e){}
  }
  function ours(u){try{return u.charAt(0)==='/'||u.indexOf(location.origin)===0;}catch(e){return false;}}
  window.addEventListener('error',function(e){
    var t=e&&e.target;
    if(t&&t!==window&&(t.src||t.href)){
      var u=String(t.src||t.href||'');
      report(ours(u)?'resource':'res3p',u);
      return;
    }
    report('error',e&&(e.message||(e.error&&e.error.message)));
  },true);
  window.addEventListener('unhandledrejection',function(e){
    report('rejection',e&&e.reason&&(e.reason.message||e.reason));
  });
})();
</script>

<!-- client picker (CONTRACT §1): one route, two presentation shells. Boot-time
     decision only — crossing the breakpoint mid-session does nothing until
     reload. localStorage 'hsk4-client' ('desktop'|'mobile') is a manual escape
     hatch, not exposed in UI yet. -->
<script>
(function(){
  var d=false;
  try{
    d=(window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches)
      ||Math.min(screen.width,screen.height)>=700;
  }catch(e){}
  try{ /* separate try: a storage SecurityError must not discard the heuristic */
    var o=localStorage.getItem('hsk4-client');
    if(o==='desktop')d=true;else if(o==='mobile')d=false;
  }catch(e){}
  window.HSK_DESKTOP=d;
  document.write('<link rel="stylesheet" href="/app/'+(d?'desktop':'app')+'.css">');
  /* Desktop bundle (~280KB) loads via document.write below, invisible to the
     preload scanner. Preload it here (in <head>, before the shared modules) so
     it fetches in PARALLEL — gated on d so mobile never pays for it. */
  if(d){var _dm=['config','shell','exam','vocab','more','study'];for(var _i=0;_i<_dm.length;_i++){document.write('<link rel="preload" as="script" href="/app/desktop-'+_dm[_i]+'.js">');}}
})();
</script>

<script>
(function(){
  /* Paint a reload screen only if the shell never rendered (empty #r-shell). */
  /* force=true: a module seam is missing even though the shell painted — the
     blank-TAB case F11 exists for. Without it both the app_error goal and the
     reload card are gated on an EMPTY #r-shell, so losing exam/vocab/more/study
     reported nothing and showed nothing. */
  function fallback(reason,force){
    try{
      var r=document.getElementById('r-shell');
      if(r&&(force||!r.innerHTML.trim())){
        try{if(window.ymGoal)ymGoal('app_error',{kind:'boot',msg:String(reason==null?'':reason).slice(0,180)});}catch(x){}
        r.innerHTML='<div style="display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:DM Sans,system-ui,sans-serif"><div style="font-size:1.05rem;font-weight:700;color:var(--ink,#2c2825)">Something went wrong</div><div style="font-size:.88rem;color:var(--stone,#8a817a);max-width:280px;line-height:1.5">The app hit an unexpected error. Please reload.</div><button onclick="location.reload()" style="border:0;background:var(--accent,#b84e2e);color:#fff8f1;border-radius:11px;padding:11px 22px;font-weight:700;font-size:.9rem;cursor:pointer">Reload</button></div>';
      }
    }catch(x){}
  }
  try{ App.boot(); }
  catch(e){ fallback(e&&e.message); return; }
  /* Boot didn't throw, but a module that silently failed to load (partial fetch,
     404) can leave the seams missing / the shell empty — assert and, if so, paint
     the reload card instead of a blank screen. */
  try{
    var miss=(window.App&&typeof App.missingSeams==='function')?App.missingSeams():['core'];
    if(miss.length){ fallback('missing seams: '+miss.join(','),true); return; }
  }catch(e2){ fallback('seams check'); return; }
  fallback('empty shell after boot');
})();
</script>
